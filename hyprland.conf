################################################# home setup ########################################################
monitor = desc:Sceptre Tech Inc Sceptre F27 0x01010101                       , 1920x1080@100, 0x0   , 1, transform, 3
monitor = desc:Philips Consumer Electronics Company PHL 271V8LB UK02439053050, 1920x1080@60 , 1080x0, 1
monitor = desc:Ancor Communications Inc VG248 J5LMQS169912                   , 1920x1080@60 , 3000x0, 1
monitor = desc:Samsung Display Corp. 0x4164                                  , disable
#####################################################################################################################

################################################# lab### ############################################################
monitor = desc:Samsung Display Corp. 0x4164                                  , disable
monitor = desc:Ancor Communications Inc ASUS PB287Q 0x0001FDDD               , 2560x1440, 0x0    , 1
monitor = desc:Lenovo Group Limited T27h-30 V5MWX659                         , 2560x1440, -1440x0, 1, transform, 1
#####################################################################################################################

# rule for quickly plugging in random monitors
monitor = , preferred, auto, 1

# unscale XWayland
#xwayland {
#  force_zero_scaling = true
#}
# AQ_DRM_DEVICES seems to break things!!
#env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
# toolkit-specific scale
#env = GDK_SCALE,2
#env = XCURSOR_SIZE,32

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
# exec-once = dunst
# exec-once = kanshi -c /home/safwan/.config/hypr/kanshi/config
# exec-once = kanshi
# exec-once=waybar -c ~/.config/hypr/waybar/config -s ~/.config/hypr/waybar/style.css
exec-once = nm-applet
# exec-once =/usr/libexec/kf5/polkit-kde-authentication-agent-1
exec-once =/usr/libexec/kf6/polkit-kde-authentication-agent-1
# exec-once = hyprpaper
exec-once = copyq --start-server
# exec-once = /home/safwan/.config/hypr/starting_xdg_hypr.sh
exec-once = systemctl --user start hyprland-session.target
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service xdg-desktop-portal.service
exec-once = dms run
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"                                                                                                                                                             
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1"
# bindl = , switch:[2d14f2a0], exec, hyprlock
# exec-once = qs -c noctalia-shell
# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
# exec-once=hyprctl plugin load /home/safwan/Documents/split-monitor-workspaces/split-monitor-workspaces.so

env = WLR_NO_HARDWARE_CURSORS,1
# env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME_QT6,qt6ct
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = XCURSOR_SIZE,24

#env = HYPRLAND_NO_CRASHREPORTER,1
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

device {
    name = wacom-intuos-s-pen
    # options ...
    transform = 0
    output = desc:Ancor Communications Inc ASUS PB287Q 0x0001FDDD
}

device {
    name = wacom-one-by-wacom-m-pen
    # options ...
    transform = 0
    output = desc:Samsung Display Corp. 0x4164
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(d65d0eff) rgba(d65d0eff) 0deg
    col.inactive_border = rgba(595959aa)

    #layout = dwindle
    # layout = master
    layout = scrolling
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 5, default, slidevert
}

misc {
    disable_hyprland_logo = true
    # disable_splash_rendering = true
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
    force_split = 2
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
    mfact = 0.5
    #new_on_top = true
    new_on_top = true
}
scrolling{
    direction = right
    explicit_column_widths = 0.5, 1.0
}

# gestures {
#     # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe = off
# }

binds {
    #this is needed to allow toggling between two work spaces
    allow_workspace_cycles = true
    movefocus_cycles_fullscreen = true
    #apps that request keybinds to be disabled (e.g. VMs) will not be able to do so.
    disable_keybind_grabbing = true
}

debug {
    enable_stdout_logs = true
    disable_logs = false
}


# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# #Applications
bind = ALT, RETURN, exec, ghostty
bind = $mainMod, RETURN, exec, kitty
bind = CTRL_ALT, T, exec, Thunar


bind = $mainMod, Q, killactive, 
# bind = SUPER_SHIFT, E, exit, 
bind = $mainMod, E, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, togglefloating, 
# bind = $mainMod, D, fullscreen, 1
# bind = $mainMod, D, togglegroup
bind = SUPER_SHIFT, D, fullscreen, 0
bind = SUPER, m, exec, wofi --show drun
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

bind = SUPER_SHIFT, RETURN, layoutmsg, swapwithmaster
bind = SUPER_SHIFT, A, layoutmsg, addmaster
bind = SUPER_SHIFT, R, layoutmsg, removemaster
bind = $mainMod, T, layoutmsg, orientationtop
bind = SUPER_SHIFT, T, layoutmsg, orientationleft
#move windows between screeens
bind = SUPER_SHIFT, comma, movewindow, mon:-1
bind = SUPER_SHIFT_L, period, movewindow, mon:+1

# Move focus with CTRL + h j k l
bind = CTRL_ALT, H, movefocus, l
bind = CTRL_ALT, L, movefocus, r
bind = CTRL_ALT, K, movefocus, u
bind = CTRL_ALT, J, movefocus, d

# Resize active windows
bind = SUPER_SHIFT, L, resizeactive, 20 0 #right
bind = SUPER_SHIFT, H, resizeactive, -20 0 #left
bind = SUPER_SHIFT, K, resizeactive, 0 -20 #up
bind = SUPER_SHIFT, J, resizeactive, 0 20 #down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, m-1
bind = $mainMod, mouse_up, workspace, m+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# to switch between windows in a floating workspace
# bind = ALT,Tab,cyclenext,          # change focus to another window
# bind = ALT,Tab,changegroupactive,          # change focus to another window
# bind = ALT,Tab,bringactivetotop,   # bring it to the top
bind = SUPER,L,workspace,m+1
bind = SUPER,H,workspace,m-1
bind = SUPER,N,exec, /home/safwan/.config/hypr/empty-ws.sh
bind = SUPER,Tab,workspace,previous_per_monitor
# bind = SUPER,M,movetoworkspace, empty

# bind = SUPER, B, exec, /home/safwan/.config/waybar/toggling-waybar
# bind = SUPER, B, exec, killall -SIGUSR1 waybar
#bind = SUPER, N, exec, eww open --toggle bar1
bind = SUPER, B, exec, pkill waybar || waybar -c /home/safwan/.config/hypr/waybar/config -s /home/safwan/.config/hypr/waybar/style.css &

#chnage audio volume
bind = CTRL, F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = CTRL, F12, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
#special workspace
bind = SUPER_ALT, H, movetoworkspace, special
bind=SUPER_ALT,H,togglespecialworkspace,

bind = CTRL_ALT, F, exec, grim -g "$(slurp -d)" - | swappy -f -
bind = CTRL_ALT, L, exec, hyprlock

bind = CTRL_ALT, N, exec, /home/safwan/.config/hypr/cycle-layout.sh
bind = $mainMod, O, exec, /home/safwan/.config/hypr/dpms-toggle.sh
bind = SUPER_SHIFT, M, exec, hyprctl keyword workspace "$(hyprctl activeworkspace -j | jq -r .id), layout:master"
bind = SUPER_SHIFT, S, exec, hyprctl keyword workspace "$(hyprctl activeworkspace -j | jq -r .id), layout:scrolling"

bind = $mainMod, right, layoutmsg,  move +col
bind = $mainMod, left,  layoutmsg,  move -col
bind = $mainMod, F,     layoutmsg,  colresize +conf
bind = ALT,      Tab,   layoutmsg,  focus right

